[config]
; IP externo da VPS ou dominio DNS (ex.: 203.0.113.10 ou game.seudominio.com)
host=127.0.0.1
; Porta de Login/Auth do servidor (padrao: 9958)
auth_port=9958
; Porta do GameServer (padrao: 5816)
game_port=5816
; Se 1, tambem sobrescreve a porta 5816 de GameServer para game_port acima
redirect_game_port=0
; Se 1, redireciona qualquer conexao remota (nao-127.0.0.1) do Conquer.exe para o host acima
redirect_all_remote=1
; Se 1, libera multi-client ilimitado (hook em CreateMutexA/W e OpenMutexA/W)
multiclient=1
; Se 1, neutraliza IsDebuggerPresent / CheckRemoteDebuggerPresent / NtQueryInformationProcess
bypass_antidebug=1
; Se 1, bloqueia abertura forcada do AutoPatch.exe ou paginas via ShellExecuteA/W
block_autopatch=1
; Se 1, gera log de diagnostico em conquer_hook.log (manter 0 em producao)
log=0
